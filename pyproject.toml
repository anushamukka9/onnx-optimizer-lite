[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-optimizer-lite"
version = "0.1.0"
description = "ONNX optimization helpers: graph statistics, dead-node elimination, constant folding, quantization guidance, and a latency benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Anusha Mukka" },
]
keywords = ["onnx", "model-optimization", "deep-learning", "inference", "quantization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
onnx = ["onnx>=1.14"]
bench = ["onnxruntime>=1.16"]
all = ["onnx>=1.14", "onnxruntime>=1.16"]
dev = ["pytest>=7"]

[project.scripts]
onnx-opt = "onnx_optimizer_lite.cli:main"

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/onnx-optimizer-lite"
Documentation = "https://github.com/anushamukka9/onnx-optimizer-lite/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
